services:
  kanban-hub:
    build: ./hub
    ports:
      - "8787:8787"
    environment:
      KANBAN_HUB_TOKEN: "${KANBAN_HUB_TOKEN:?set KANBAN_HUB_TOKEN}"
      KANBAN_HUB_LEASE_TTL_SECONDS: "1800"
      KANBAN_HUB_BACKUP_DIR: "/data/backups"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - hub-data:/data
volumes:
  hub-data:
