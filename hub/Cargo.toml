[package]
name = "kanban-hub"
version = "0.1.0"
edition = "2024"
description = "Shared card hub for dsh-kanban: central coordination, lease/claim, offline-friendly sync"
license = "MIT"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
